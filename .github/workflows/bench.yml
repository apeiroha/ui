name: Bench

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bench-pages
  cancel-in-progress: true

jobs:
  bench:
    name: collect + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang musl-tools

      - name: Build release benchmarks (clang)
        run: make bench-build BUILD=release TOOLCHAIN=clang

      - name: Collect benchmark run
        env:
          TOOLCHAIN: clang
          BUILD: release
        run: node scripts/bench_collect.mjs --bin-dir build --iters 3 --attempts 8 --out bench-output.json

      - name: Publish dashboard to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bench_publish.sh bench-output.json
