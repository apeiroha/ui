name: Bench

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to benchmark (recorded as run.ref)'
        required: true
        default: 'main'

permissions:
  contents: write

concurrency:
  group: bench-pages
  cancel-in-progress: true

jobs:
  bench:
    name: collect + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual runs target the requested ref so its run is tagged with
          # that ref name; push/schedule keep the default (the pushed ref).
          # Without this every run.ref would be "main" and the compare page
          # could not tell branches apart.
          ref: ${{ inputs.ref || github.ref_name }}

      - uses: ./.github/actions/setup-clang

      - name: Build release benchmarks (clang 19)
        run: make bench-build BUILD=release TOOLCHAIN=clang CC=clang-19

      - name: Collect benchmark run
        env:
          TOOLCHAIN: clang
          BUILD: release
        run: node scripts/bench_collect.mjs --bin-dir build --iters 3 --attempts 8 --out bench-output.json

      - name: Publish dashboard to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bench_publish.sh bench-output.json
