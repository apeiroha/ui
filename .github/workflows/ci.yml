name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # clang 19 matches the development toolchain.  gcc 14 is
          # installed by ./.github/actions/setup-gcc because it is the
          # first release that spells the standard `c23`; the runner's
          # default gcc 13 only accepts the older `c2x` alias.
          - toolchain: clang
            std: c23
            cc: clang-19
            setup: ./.github/actions/setup-clang
          - toolchain: gcc
            std: c23
            cc: x86_64-linux-gnu-gcc-14
            setup: ./.github/actions/setup-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: ${{ matrix.setup }}

      - name: Build library
        run: make libui TOOLCHAIN=${{ matrix.toolchain }} STD=${{ matrix.std }} CC=${{ matrix.cc }}

      - name: Run test suite
        run: make test TOOLCHAIN=${{ matrix.toolchain }} STD=${{ matrix.std }} CC=${{ matrix.cc }}

  asan:
    name: ASan P0 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-clang

      - name: Run ASan regression
        run: make test-p0-asan TOOLCHAIN=clang CC=clang-19

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-clang

      - name: Build optimized library
        run: make libui BUILD=release TOOLCHAIN=clang CC=clang-19
