name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # clang ships a complete C23 front end; gcc 13 (Ubuntu 24.04)
          # still spells the standard `c2x` (same feature set for this code).
          - toolchain: clang
            std: c23
          - toolchain: gcc
            std: c2x
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc musl-tools

      - name: Build library
        run: make libui TOOLCHAIN=${{ matrix.toolchain }} STD=${{ matrix.std }}

      - name: Run test suite
        run: make test TOOLCHAIN=${{ matrix.toolchain }} STD=${{ matrix.std }}

  asan:
    name: ASan P0 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang musl-tools

      - name: Run ASan regression
        run: make test-p0-asan TOOLCHAIN=clang

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang musl-tools

      - name: Build optimized library
        run: make libui BUILD=release TOOLCHAIN=clang
