name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # clang 19 matches the development toolchain.  gcc 13 (Ubuntu
          # 24.04) still spells the C standard `c2x` (same feature set
          # for this code).
          - toolchain: clang
            std: c23
            cc: clang-19
          - toolchain: gcc
            std: c2x
            cc: x86_64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-clang

      - name: Build library
        run: make libui TOOLCHAIN=${{ matrix.toolchain }} STD=${{ matrix.std }} CC=${{ matrix.cc }}

      - name: Run test suite
        run: make test TOOLCHAIN=${{ matrix.toolchain }} STD=${{ matrix.std }} CC=${{ matrix.cc }}

  asan:
    name: ASan P0 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-clang

      - name: Run ASan regression
        run: make test-p0-asan TOOLCHAIN=clang CC=clang-19

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-clang

      - name: Build optimized library
        run: make libui BUILD=release TOOLCHAIN=clang CC=clang-19
